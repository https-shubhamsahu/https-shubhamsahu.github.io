name: Notify IndexNow after Pages deployment
on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit changed live pages
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL" = "true" ]; then
            node .github/scripts/submit-indexnow.mjs . --all
          else
            node .github/scripts/submit-indexnow.mjs .
          fi
